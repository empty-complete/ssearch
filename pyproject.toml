[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ssearch"
version = "0.2.0"
description = "Private offline document search for Windows"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{name = "Филипп Белобородов", email = "filipp.beloborodoff@yandex.ru"}]
dependencies = [
  "PySide6-Essentials==6.8.3",
  "ssearch-core[semantic,postgres]==0.2.0",
  "psycopg[binary]==3.3.6",
  "psycopg-binary==3.3.6",
  "tzdata==2026.5",
  "typing_extensions==4.16.0",
]

[project.urls]
Repository = "https://github.com/empty-complete/ssearch"
Releases = "https://github.com/empty-complete/ssearch/releases"

[project.optional-dependencies]
build = ["pyinstaller==6.16.0", "pytest==8.4.2"]

[project.gui-scripts]
ssearch = "atom_search.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "packages/atom-search-core/src"]
testpaths = ["tests"]
