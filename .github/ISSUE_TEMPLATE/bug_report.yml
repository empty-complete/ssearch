name: Bug report
description: Report a reproducible problem with ssearch.
body:
  - type: markdown
    attributes:
      value: |
        English and Russian are welcome. Use synthetic examples and redact private paths, company data and credentials. For security issues, email filipp.beloborodoff@yandex.ru instead of posting publicly.
  - type: input
    id: version
    attributes:
      label: App version or commit
      description: Include the development release or CI run link if available.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Include the Windows version and build; say whether this is a VM.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: For search issues, include a small invented folder tree and the exact query.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual result
      description: Explain what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional evidence
      description: Add a redacted screenshot, error message or relevant log excerpt. Do not upload a real index or document collection.
