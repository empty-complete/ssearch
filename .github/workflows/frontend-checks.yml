name: Frontend candidate
on:
  pull_request:
    paths: ['frontend/**', 'desktop/**', 'tools/build_frontend.ps1', '.github/workflows/frontend-checks.yml', 'LICENSE.txt', 'src/atom_search/content.py', 'src/atom_search/service/contracts.py', 'resources/branding/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Pin npm
        run: npm install --global npm@11.19.1 --ignore-scripts
      - name: Resolve locked frontend dependencies and warm offline cache
        working-directory: frontend
        run: npm ci --ignore-scripts --cache .cache/npm --no-audit --no-fund
      - name: Frontend types and behavior
        working-directory: frontend
        run: |
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
      - name: Resolve locked desktop build dependencies
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --ignore-scripts --cache .cache/npm --no-audit --no-fund
      - name: Missing and empty frontend cache fail before npm ci
        shell: pwsh
        run: |
          $marker = Join-Path $PWD 'frontend/node_modules/.offline-negative-proof'
          Set-Content -LiteralPath $marker -Value 'preserve-before-npm-ci'
          $empty = Join-Path $PWD 'frontend/.cache/negative-empty'
          New-Item -ItemType Directory -Path $empty | Out-Null
          $cases = @(
            @{ name='missing'; path=(Join-Path $PWD 'frontend/.cache/negative-missing'); error='Offline npm cache is missing.' },
            @{ name='empty'; path=$empty; error='Offline locked cache incomplete:' }
          )
          $receipts = @()
          foreach ($case in $cases) {
            $message = ''
            try {
              ./tools/build_frontend.ps1 -CachePath $case.path -DesktopCachePath "$PWD/desktop/.cache/npm"
              throw 'Unexpected success for incomplete cache'
            } catch { $message = $_.Exception.Message }
            if (!$message.StartsWith($case.error)) { throw "Unexpected cache failure: $message" }
            if (!(Test-Path -LiteralPath $marker)) { throw 'npm ci ran before cache rejection' }
            if (Test-Path -LiteralPath (Join-Path $case.path '_cacache/content-v2')) { throw 'Package content appeared in rejected cache' }
            $receipts += @{ scenario=$case.name; rejected_before_npm_ci=$true; package_downloads=$false; error=$message }
          }
          Remove-Item -LiteralPath $marker
          ConvertTo-Json -InputObject $receipts -Depth 6 | Set-Content frontend/.cache/offline-negative.json
      - name: Offline rebuild of both locked dependency trees and frontend bundle
        shell: pwsh
        run: ./tools/build_frontend.ps1 -CachePath "$PWD/frontend/.cache/npm" -DesktopCachePath "$PWD/desktop/.cache/npm"
      - name: Desktop types, safety and compile
        working-directory: desktop
        run: |
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
      - name: Headless browser scenarios (GitHub only)
        working-directory: frontend
        run: |
          npx --no-install playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            frontend/dist
            frontend/test-results
            frontend/playwright-report
            frontend/compatibility
            desktop/dist
          retention-days: 14
