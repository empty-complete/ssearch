name: Windows build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Scope; source runs selected tests without packaging
        type: choice
        options: [full, quick, source, installer, agent-resolver]
        default: full
      test_targets:
        description: 'Python targets: JSON array of existing test files/nodeids'
        type: string
        default: '[]'
      desktop_stack:
        description: Build the Electron package and frozen headless service candidate
        type: boolean
        default: false
      agent_sdk:
        description: Prepare the approved MCP SDK lock for manual source tests only
        type: boolean
        default: false
      frontend_test_targets:
        description: 'Electron Quick: JSON array of frontend test files'
        type: string
        default: '[]'
      desktop_test_targets:
        description: 'Electron Quick: JSON array of desktop test files'
        type: string
        default: '[]'
      publish:
        description: Publish a development prerelease (Full on main only)
        type: boolean
        default: false
      installer_input:
        description: Exact existing installer proof input (installer mode only)
        type: choice
        options: [quick99, full6a]
        default: quick99

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.scope.outputs.build }}
      tested_sha: ${{ steps.scope.outputs.tested_sha }}
      pr_number: ${{ steps.scope.outputs.pr_number }}
      pr_head_repository: ${{ steps.scope.outputs.pr_head_repository }}
      route: ${{ steps.scope.outputs.route }}
      mode: ${{ steps.scope.outputs.mode }}
      targets: ${{ steps.scope.outputs.targets }}
      authentication: ${{ steps.scope.outputs.authentication }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
      EVENT_NAME: ${{ github.event_name }}
      SOURCE_SHA: ${{ github.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - id: scope
        name: Keep documentation and unpackaged UI candidates out of the binary build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Read-GitHubJson([string]$Endpoint) {
            $response = gh api $Endpoint
            if ($LASTEXITCODE -ne 0) { throw "GitHub API request failed: $Endpoint" }
            return $response | ConvertFrom-Json
          }
          $required = $true
          $route = 'binary'
          $reviewMode = ''; $reviewTargets = ''; $authentication = ''
          $prNumber = [int]$env:PR_NUMBER
          $testedSha = $env:SOURCE_SHA
          $headRepository = $env:GH_REPO
          if ($env:EVENT_NAME -eq 'push') {
            $associated = Read-GitHubJson "repos/$env:GH_REPO/commits/$env:SOURCE_SHA/pulls?per_page=100"
            $merged = @($associated | Where-Object {
              $_.merged_at -and $_.base.ref -eq 'main' -and $_.base.repo.full_name -eq $env:GH_REPO -and
              $_.merge_commit_sha -eq $env:SOURCE_SHA
            })
            if ($merged.Count -ne 1) { throw 'Push is not one exact merged PR; use an explicit Full main workflow to publish.' }
            $prNumber = [int]$merged[0].number
          }
          if ($prNumber -gt 0) {
            $pr = Read-GitHubJson "repos/$env:GH_REPO/pulls/$prNumber"
            if ($env:EVENT_NAME -eq 'push' -and (-not $pr.merged -or $pr.base.ref -ne 'main' -or
                $pr.base.repo.full_name -ne $env:GH_REPO -or $pr.merge_commit_sha -ne $env:SOURCE_SHA)) {
              throw 'Associated PR is not the exact merge on main.'
            }
            if ($env:EVENT_NAME -eq 'pull_request' -and $pr.head.sha -ne $env:PR_HEAD_SHA) {
              throw 'PR head changed while classifying this run.'
            }
            $testedSha = $pr.head.sha
            $headRepository = $pr.head.repo.full_name
            # Publisher-only changes must preserve the exact base/head workflow
            # header and binary build job. Unknown files still require Full.
            $scopeArguments = @('tools/ci_publish.py', 'classify', '--pr-number', $prNumber, '--head-sha', $testedSha)
            if ($env:EVENT_NAME -eq 'push') { $scopeArguments += @('--merge-sha', $env:SOURCE_SHA) }
            $classification = & python @scopeArguments
            if ($LASTEXITCODE -ne 0 -or $classification -notin @('true', 'false', 'candidate-source', 'installer-source', 'owner-source')) {
              throw 'Could not safely classify the exact PR head.'
            }
            $required = $classification -in @('true', 'candidate-source', 'installer-source', 'owner-source')
            if ($classification -ceq 'owner-source') {
              $route = $classification
              $ownerArguments = @('tools/ci_source_scopes.py', 'settings', '--pr-number', $prNumber, '--head-sha', $testedSha)
              if ($env:EVENT_NAME -eq 'push') { $ownerArguments += @('--merge-sha', $env:SOURCE_SHA) }
              $settingsJson = & python @ownerArguments
              if ($LASTEXITCODE -ne 0) { throw 'Owner source settings unavailable.' }
              $settings = $settingsJson | ConvertFrom-Json
              if ($settings.route -cne 'owner-source' -or $settings.mode -cne 'source' -or
                  $settings.desktop_stack -ne $false -or $settings.publish -ne $false -or
                  @($settings.test_targets).Count -eq 0) { throw 'Invalid owner source settings.' }
              $reviewMode = $settings.mode
              $reviewTargets = ConvertTo-Json -InputObject @($settings.test_targets) -Compress
              $authentication = 'owner'
            }
            if ($classification -in @('candidate-source', 'installer-source')) {
              $route = $classification
              $settingsJson = & python tools/ci_p4_candidate.py --settings $route
              if ($LASTEXITCODE -ne 0) { throw 'Source review settings unavailable.' }
              $settings = $settingsJson | ConvertFrom-Json
              if ($settings.mode -cne 'source' -or $settings.desktop_stack -ne $false -or
                  $settings.publish -ne $false -or $settings.authentication -cnotin @('candidate', 'full6a')) {
                throw 'Invalid source review settings.'
              }
              $reviewMode = $settings.mode
              $reviewTargets = ConvertTo-Json -InputObject @($settings.test_targets) -Compress
              $authentication = $settings.authentication
            }
          }
          if ($testedSha -notmatch '^[0-9a-f]{40}$' -or $headRepository -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw 'Invalid source identity returned by GitHub.'
          }
          "build=$($required.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tested_sha=$testedSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "pr_number=$prNumber" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "pr_head_repository=$headRepository" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "route=$route" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "mode=$reviewMode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "targets=$reviewTargets" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "authentication=$authentication" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  agent-resolver:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'agent-resolver'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONUTF8: '1'
      SOURCE_SHA: ${{ github.sha }}
      RESOLVER_PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
      RESOLVER_DESKTOP: ${{ inputs.desktop_stack && 'true' || 'false' }}
      RESOLVER_AGENT: ${{ inputs.agent_sdk && 'true' || 'false' }}
      RESOLVER_INSTALLER: ${{ inputs.installer_input }}
      RESOLVER_PYTHON_TARGETS: ${{ inputs.test_targets }}
      RESOLVER_FRONTEND_TARGETS: ${{ inputs.frontend_test_targets }}
      RESOLVER_DESKTOP_TARGETS: ${{ inputs.desktop_test_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Validate the manual dependency-only scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RESOLVER_PUBLISH -cne 'false' -or $env:RESOLVER_DESKTOP -cne 'false' -or $env:RESOLVER_AGENT -cne 'false' -or
              $env:RESOLVER_INSTALLER -cne 'quick99') { throw 'AGENT_RESOLVER_SCOPE_INVALID' }
          foreach ($name in @('RESOLVER_PYTHON_TARGETS', 'RESOLVER_FRONTEND_TARGETS', 'RESOLVER_DESKTOP_TARGETS')) {
            try { $targets = ConvertFrom-Json -InputObject ([Environment]::GetEnvironmentVariable($name)) -NoEnumerate }
            catch { throw 'AGENT_RESOLVER_SCOPE_INVALID' }
            if ($targets -isnot [array] -or $targets.Count -ne 0) { throw 'AGENT_RESOLVER_SCOPE_INVALID' }
          }
      - name: Resolve fixed SDK wheels and prove the isolated offline closure
        shell: pwsh
        run: |
          & python tools/ci_agent_dependencies.py --source-commit $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain only the dependency proposal and closed proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-sdk-proposal-${{ env.SOURCE_SHA }}
          path: |
            artifacts/ci-agent-resolver/${{ env.SOURCE_SHA }}/agent-requirements.proposal.txt
            artifacts/ci-agent-resolver/${{ env.SOURCE_SHA }}/resolver-report.json
            artifacts/ci-agent-resolver/${{ env.SOURCE_SHA }}/provenance.json
            artifacts/ci-agent-resolver/${{ env.SOURCE_SHA }}/offline-receipt.json
          if-no-files-found: error
          retention-days: 7

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true' && github.event_name != 'push' && inputs.mode != 'agent-resolver'
    runs-on: windows-2025
    timeout-minutes: 355
    permissions:
      contents: read
      actions: read
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      BUILD_MODE: ${{ needs.changes.outputs.mode || inputs.mode || 'full' }}
      TEST_TARGETS_JSON: ${{ needs.changes.outputs.targets || inputs.test_targets || '[]' }}
      SSEARCH_INSTALLER_INPUT_SET: ${{ inputs.installer_input || 'quick99' }}
      DESKTOP_STACK: ${{ inputs.desktop_stack && 'true' || 'false' }}
      AGENT_SDK: ${{ inputs.agent_sdk && 'true' || 'false' }}
      FRONTEND_TEST_TARGETS_JSON: ${{ inputs.frontend_test_targets || '[]' }}
      DESKTOP_TEST_TARGETS_JSON: ${{ inputs.desktop_test_targets || '[]' }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Authenticate the unchanged candidate proofs before exact-head source tests
        if: needs.changes.outputs.route == 'candidate-source' || needs.changes.outputs.route == 'installer-source'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @('tools/ci_p4_candidate.py', '--head-sha', $env:SOURCE_SHA, '--pr-number', '${{ needs.changes.outputs.pr_number }}')
          if ('${{ needs.changes.outputs.authentication }}' -ceq 'full6a') { $arguments += '--installer-review' }
          & python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Authenticate the exact owner source scope
        if: needs.changes.outputs.route == 'owner-source'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & python tools/ci_source_scopes.py authenticate --pr-number '${{ needs.changes.outputs.pr_number }}' --head-sha $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate requested build scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $count = 0
          if ($env:AGENT_SDK -ceq 'true' -and ('${{ github.event_name }}' -cne 'workflow_dispatch' -or
              $env:BUILD_MODE -cne 'source' -or $env:DESKTOP_STACK -cne 'false' -or '${{ inputs.publish }}' -eq 'true')) {
            throw 'AGENT_SOURCE_SCOPE_INVALID'
          }
          foreach ($name in @('TEST_TARGETS_JSON', 'FRONTEND_TEST_TARGETS_JSON', 'DESKTOP_TEST_TARGETS_JSON')) {
            $targets = ConvertFrom-Json -InputObject ([Environment]::GetEnvironmentVariable($name)) -NoEnumerate
            if ($targets -isnot [array] -or @($targets | Where-Object { $_ -isnot [string] }).Count) {
              throw 'Test targets must be JSON arrays of strings.'
            }
            if ($name -ne 'TEST_TARGETS_JSON' -and $env:DESKTOP_STACK -ne 'true' -and $targets.Count) {
              throw 'UI targets require the desktop stack.'
            }
            $count += $targets.Count
          }
          if ($env:BUILD_MODE -eq 'full' -and $count -ne 0) { throw 'Full does not accept test targets.' }
          if ($env:BUILD_MODE -in @('quick', 'source') -and $count -eq 0) { throw 'Quick/source requires explicit targets.' }
          if ($env:BUILD_MODE -notin @('full', 'quick', 'source', 'installer')) { throw 'Unknown build mode.' }
          if ($env:SSEARCH_INSTALLER_INPUT_SET -cnotin @('quick99', 'full6a') -or
              ($env:SSEARCH_INSTALLER_INPUT_SET -ceq 'full6a' -and $env:BUILD_MODE -cne 'installer')) {
            throw 'Installer input selection requires installer mode.'
          }
          if ($env:BUILD_MODE -eq 'installer' -and ('${{ github.event_name }}' -ne 'workflow_dispatch' -or
              $env:DESKTOP_STACK -ne 'false' -or $count -ne 0 -or '${{ inputs.publish }}' -eq 'true')) {
            throw 'Installer proof is manual only, without packaging, publication or test targets.'
          }
          if ($env:BUILD_MODE -eq 'source' -and '${{ inputs.publish }}' -eq 'true') { throw 'Source tests cannot publish a build.' }
          if ($env:BUILD_MODE -eq 'source' -and $env:DESKTOP_STACK -eq 'true') { throw 'Source mode cannot package the desktop stack.' }
      - name: Pinned Node for the explicit desktop candidate
        if: env.DESKTOP_STACK == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - name: Prepare pinned npm and locked offline desktop caches
        if: env.DESKTOP_STACK == 'true'
        shell: pwsh
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          & npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($project in @('frontend', 'desktop')) {
            Push-Location -LiteralPath $project
            try {
              & npm ci --ignore-scripts --cache .cache/npm --no-audit --no-fund
              if ($LASTEXITCODE -ne 0) { throw 'Locked cache preparation failed.' }
            } finally { Pop-Location }
          }
          & ./tools/prepare_desktop_ci.ps1
      - name: Prepare verified public inputs
        if: env.BUILD_MODE != 'installer'
        shell: pwsh
        run: |
          $arguments = @('tools/prepare_ci.py')
          if ($env:BUILD_MODE -eq 'source') { $arguments += '--source' }
          if ($env:AGENT_SDK -ceq 'true') { $arguments += '--agent' }
          if ($env:DESKTOP_STACK -eq 'true') { $arguments += '--desktop' }
          & python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Admit the exact existing installer without rebuilding
        if: env.BUILD_MODE == 'installer'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & python tools/ci_installer.py fetch --harness-commit $env:SOURCE_SHA --input-set $env:SSEARCH_INSTALLER_INPUT_SET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run selected scope under the verified standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tools/run_ci_build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain reviewed build outputs
        if: env.BUILD_MODE != 'source' && env.BUILD_MODE != 'installer'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ env.SOURCE_SHA }}-${{ inputs.mode || 'full' }}
          path: |
            artifacts/ci-export/ssearch-Setup-*.exe
            artifacts/ci-export/build-manifest.json
            artifacts/ci-export/test-receipt.json
            artifacts/ci-export/ci-evidence.json
            artifacts/ci-export/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retain the closed installation receipt only
        if: always() && env.BUILD_MODE == 'installer'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-service-installer-proof-${{ env.SOURCE_SHA }}
          path: artifacts/ci-installer/installation-receipt.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain source test receipt only
        if: always() && env.BUILD_MODE == 'source'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-tests-${{ env.SOURCE_SHA }}
          path: artifacts/ci-source/test-receipt.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain only the source SDK input receipt
        if: >-
          always() && env.BUILD_MODE == 'source' && env.AGENT_SDK == 'true' &&
          hashFiles(format('artifacts/ci-agent-source/{0}/input-receipt.json', env.SOURCE_SHA)) != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-source-inputs-${{ env.SOURCE_SHA }}
          path: artifacts/ci-agent-source/${{ env.SOURCE_SHA }}/input-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain isolated native UTF-8 experiment only
        if: >-
          success() && env.BUILD_MODE == 'source' &&
          hashFiles(format('artifacts/ci-native-utf8/{0}/ssearch-pg-utf8-candidate.zip', env.SOURCE_SHA)) != '' &&
          hashFiles(format('artifacts/ci-native-utf8/{0}/candidate-receipt.json', env.SOURCE_SHA)) != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-utf8-experiment-${{ env.SOURCE_SHA }}
          path: |
            artifacts/ci-native-utf8/${{ env.SOURCE_SHA }}/ssearch-pg-utf8-candidate.zip
            artifacts/ci-native-utf8/${{ env.SOURCE_SHA }}/candidate-receipt.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [changes, build]
    if: >-
      always() && !cancelled() && needs.changes.outputs.build == 'true' &&
      needs.changes.outputs.route != 'candidate-source' &&
      needs.changes.outputs.route != 'installer-source' &&
      needs.changes.outputs.route != 'owner-source' &&
      inputs.mode != 'agent-resolver' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
        inputs.publish && inputs.mode == 'full' && needs.build.result == 'success'))
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Publish the exact verified Full artifact
        shell: pwsh
        run: |
          & python tools/ci_publish.py publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
